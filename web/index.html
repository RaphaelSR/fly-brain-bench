<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Brain Bench</title>
<meta name="description" content="Stimulate a population of neurons in a real fruit fly connectome and watch the spikes spread, drive a 3D fly, and teach a decoder.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="bench">

<div id="boot" role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="boot-inner">
    <header class="boot-head">
      <div class="boot-top">
        <p class="eyebrow" data-i18n="boot.eyebrow"></p>
        <select id="langBoot" class="lang" aria-label="Language"></select>
      </div>
      <h1 id="introTitle" data-i18n-html="boot.headline"></h1>
    </header>
    <div class="primer">
      <article class="card c1">
        <span class="n" data-i18n="boot.c1.n"></span>
        <h2 data-i18n="boot.c1.h"></h2>
        <p data-i18n-html="boot.c1.p"></p>
      </article>
      <article class="card c2">
        <span class="n" data-i18n="boot.c2.n"></span>
        <h2 data-i18n="boot.c2.h"></h2>
        <p data-i18n-html="boot.c2.p"></p>
        <div class="bucket" aria-hidden="true">
          <svg viewBox="0 0 260 92" role="img">
            <line x1="0" y1="34" x2="260" y2="34" class="th" stroke-dasharray="4 5"></line>
            <text x="4" y="28" class="lbl" data-i18n="boot.threshold"></text>
            <path id="trace" class="tr" d=""></path>
            <line x1="0" y1="76" x2="260" y2="76" class="rest"></line>
            <text x="4" y="88" class="lbl" data-i18n="boot.rest"></text>
          </svg>
        </div>
      </article>
      <article class="card c3">
        <span class="n" data-i18n="boot.c3.n"></span>
        <h2 data-i18n="boot.c3.h"></h2>
        <p data-i18n-html="boot.c3.p"></p>
      </article>
    </div>
    <div class="boot-foot">
      <div class="load">
        <div class="load-row"><span id="loadLabel"></span><span id="loadPct" class="mono">0%</span></div>
        <div class="track"><div id="loadBar"></div></div>
        <p id="loadDetail" data-i18n="boot.detail"></p>
        <p id="introHint" class="intro-hint" role="status" data-i18n="intro.loading"></p>
        <button id="btnEnter" class="intro-enter" disabled data-i18n="intro.bench">Enter the bench</button>
      </div>
    </div>
  </div>
</div>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.sub"></p>
    </div>
  </div>
  <div class="top-stats mono">
    <span><b id="statT">0.0</b> <i data-i18n="stat.ms"></i></span>
    <span><b id="statActive">0</b> <i data-i18n="stat.settling"></i></span>
    <span><b id="statSpikes">0</b> <i data-i18n="stat.spikes"></i></span>
    <span><b id="statFps">0</b> <i data-i18n="stat.fps"></i></span>
  </div>
  <select id="lang" class="lang" aria-label="Language"></select>
  <a class="ghost scenario" href="defend/">&#9656;&nbsp;<span data-i18n="app.scenario"></span></a>
  <button id="btnHelp" class="ghost" data-i18n="app.help"></button>
</header>

<main>
  <aside class="rail left">
    <h2 class="rail-title"><span data-i18n="rail.stimulate"></span><button class="info" data-info="stimulate" aria-label="info">i</button></h2>
    <div id="library"></div>
  </aside>

  <section class="centre">
    <section class="fly-stage">
      <div class="scene-toolbar">
        <div><span class="scene-title" data-i18n="body.title"></span><span id="behaveNow" class="mono beh">—</span></div>
        <button id="btnCamera" class="ghost" data-i18n="scene.reset">Reset camera</button>
      </div>
      <canvas id="flywell" aria-label="Interactive 3D fruit fly"></canvas>
      <div class="fly-caption"><span data-i18n="scene.hint">Drag to orbit · scroll to zoom</span><span data-i18n="body.engineered"></span><button class="info" data-info="body" aria-label="info">i</button></div>
      <p id="viewStatus" class="view-status" role="status"></p>
    </section>
    <div class="channels">
      <h2 class="rail-title"><span data-i18n="rail.channels"></span><button class="info" data-info="channels" aria-label="info">i</button>
        <span class="mono dim" data-i18n="body.engineered"></span></h2>
      <div id="chanBody"></div>
    </div>
  </section>

  <aside class="rail right">
    <div class="well-wrap">
      <canvas id="well"></canvas>
      <div id="inspect"></div>
      <div id="regions" class="regions" aria-hidden="true"></div>
      <div id="legend" class="legend"></div>
      <div class="well-hint" data-i18n="well.hint"></div>
      <div class="well-tools">
        <button id="btnRegions" class="tool" aria-label="regions"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/><path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button id="btnShare" class="tool" aria-label="share"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M6.4 9.6 9.6 6.4M6.9 4.4l1.2-1.2a2.6 2.6 0 1 1 3.7 3.7l-1.2 1.2M9.1 11.6l-1.2 1.2a2.6 2.6 0 1 1-3.7-3.7l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></button>
        <button class="info" data-info="regions" aria-label="info">i</button>
        <button class="info" data-info="brain" aria-label="info">i</button>
      </div>
    </div>
    <section class="panel">
      <h2 class="rail-title"><span data-i18n="train.title"></span><button class="info" data-info="decoder" aria-label="info">i</button>
        <span class="seg"><button id="modeRules" class="on" data-i18n="train.mode.rules"></button><button id="modeLearned" data-i18n="train.mode.learned"></button></span>
      </h2>
      <p class="tiny"><button class="info" data-info="train" aria-label="info">i</button><span data-i18n="train.pick"></span></p>
      <div id="behavePick" class="behave-grid"></div>
      <div class="train-row">
        <button id="btnTrain" class="primary sm" disabled></button>
        <button id="btnClear" class="ghost sm" data-i18n="train.clear"></button>
      </div>
      <p id="trainStat" class="tiny dim"></p>
      <p class="tiny note" data-i18n-html="train.note"></p>
    </section>

    <section class="panel grow">
      <h2 class="rail-title"><span data-i18n="rail.driving"></span></h2>
      <p class="sel-name" id="selName">—</p>
      <p class="sel-meta mono" data-i18n-html="rail.atrate" id="selMeta"></p>
      <p class="sel-why" id="selWhy"></p>
      <h2 class="rail-title mt"><span data-i18n="rail.responding"></span><button class="info" data-info="responding" aria-label="info">i</button>
        <span class="mono dim"><b id="respCount">0</b> <i data-i18n="rail.types"></i></span></h2>
      <div id="respBody"></div>
    </section>
  </aside>
</main>

<footer class="transport">
  <div class="tp-controls">
    <button id="btnPlay" class="primary"></button>
    <button id="btnReset" class="ghost" data-i18n="tp.reset"></button>
  </div>
  <label class="slider"><span data-i18n="tp.speed"></span>
    <input id="speed" type="range" min="1" max="40" value="8">
    <span id="speedOut" class="mono"></span>
  </label>
  <label class="slider"><span data-i18n="tp.structure"></span>
    <input id="glow" type="range" min="0.05" max="1.1" step="0.01" value="0.34">
  </label>
  <button class="info" data-info="transport" aria-label="info">i</button>
</footer>

<div id="infoPop" role="dialog" aria-live="polite"><h4></h4><p></p></div>

<div id="explainer">
  <div class="ex-sheet">
    <button id="btnCloseHelp" class="ex-close" aria-label="Close">&times;</button>
    <div class="ex-body">
      <p class="eyebrow" data-i18n="ex.eyebrow"></p>
      <h2 class="ex-title" data-i18n="ex.title"></h2>
      <div class="ex-grid">
        <section class="ex-card k-map"><h3><span class="k">1</span><span data-i18n="ex.1.h"></span></h3>
          <p data-i18n-html="ex.1.p"></p><p class="aside" data-i18n="ex.1.a"></p></section>
        <section class="ex-card k-cell"><h3><span class="k">2</span><span data-i18n="ex.2.h"></span></h3>
          <p data-i18n-html="ex.2.p"></p><p class="aside" data-i18n="ex.2.a"></p></section>
        <section class="ex-card k-sign"><h3><span class="k">3</span><span data-i18n="ex.3.h"></span></h3>
          <p data-i18n-html="ex.3.p"></p></section>
        <section class="ex-card k-do"><h3><span class="k">4</span><span data-i18n="ex.4.h"></span></h3>
          <p data-i18n-html="ex.4.p"></p><p class="aside" data-i18n="ex.4.a"></p></section>
        <section class="ex-card k-body"><h3><span class="k">5</span><span data-i18n="ex.5.h"></span></h3>
          <p data-i18n-html="ex.5.p"></p><p class="aside" data-i18n="ex.5.a"></p></section>
        <section class="ex-card k-not"><h3><span class="k">6</span><span data-i18n="ex.6.h"></span></h3>
          <ul><li data-i18n-html="ex.6.l1"></li><li data-i18n-html="ex.6.l2"></li><li data-i18n-html="ex.6.l3"></li></ul></section>
        <section class="ex-card k-why"><h3><span class="k">·</span><span data-i18n="ex.why.h"></span></h3>
          <p data-i18n-html="ex.why.p"></p>
          <p class="cmp">
            <span><b>139k</b> <i data-i18n-html="ex.cmp.1"></i></span>
            <span><b>86B</b> <i data-i18n-html="ex.cmp.2"></i></span>
            <span><b>0</b> <i data-i18n-html="ex.cmp.3"></i></span>
          </p></section>
      </div>
      <p class="ex-src" data-i18n="ex.src"></p>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
(function () {
  const path = document.getElementById('trace'); if (!path) return;
  const W = 260, REST = 76, TH = 34;
  let v = REST, t = 0, pts = [];
  setInterval(() => {
    t++;
    if (Math.random() < 0.16) v -= 9 + Math.random() * 9;
    v += (REST - v) * 0.12;
    if (v < TH) { pts.push([t, TH - 12]); v = REST; }
    pts.push([t, v]);
    if (pts.length > W) pts = pts.slice(-W);
    const x0 = pts[0][0];
    path.setAttribute('d', 'M' + pts.map(p => `${(p[0] - x0)},${p[1].toFixed(1)}`).join('L'));
  }, 34);
})();
</script>
</body>
</html>
